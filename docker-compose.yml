services:
  postgres:
    image: postgres:16
    container_name: evershine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evershine
      POSTGRES_PASSWORD: evershine_dev_password
      POSTGRES_DB: evershine_db
    ports:
      - "5432:5432"
    volumes:
      - evershine_pg_data:/var/lib/postgresql/data
 
volumes:
  evershine_pg_data:
 